<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caesar Workbench 项目 HQ</title>
<style>
:root{--bg:#f3f6fb;--panel:#fff;--ink:#172033;--muted:#748096;--line:#dfe5ef;--soft:#f2f5fa;--accent:#f0703c;--green:#58a86d;--blue:#466fce;--navy:#1d2942;--shadow:0 14px 42px #24324d12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",sans-serif}
.shell{max-width:1240px;margin:auto;padding:34px 28px 100px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between}.tools{display:flex;gap:8px;align-items:center}
button,.file,select,input,textarea{font:inherit}button,.file{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink)}button.primary{background:var(--ink);color:#fff}.file input{display:none}.connection{font-size:12px;color:var(--muted)}.connection.live{color:#398250}
h1{font-size:30px;letter-spacing:-.04em;margin:0}h2{font-size:19px}.intro{max-width:880px;color:#4f4c47;margin-bottom:46px}.component{margin:20px 0}.workspace{margin-top:26px}.tabs{position:sticky;top:10px;z-index:10;display:flex;gap:6px;padding:6px;background:#e8edf6cc;backdrop-filter:blur(16px);border:1px solid #dbe2ee;border-radius:16px;box-shadow:0 10px 28px #24324d0d;overflow-x:auto}.tab{display:flex;align-items:center;gap:8px;white-space:nowrap;border:0;background:transparent;color:#68758b;border-radius:11px;padding:10px 15px;font-weight:750}.tab:hover{background:#ffffff99;color:var(--ink)}.tab.active{background:var(--navy);color:#fff;box-shadow:0 6px 16px #1d294230}.tab-icon{font-size:17px;line-height:1}.tab-count{display:grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#ffffff24;font-size:11px}.tab:not(.active) .tab-count{background:#fff;color:#657087}.tab-panel{display:none;animation:panel-in .18s ease}.tab-panel.active{display:block}.tab-panel>.empty{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:16px}.tab-summary{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:26px 2px 6px}.tab-summary h2{font-size:24px;margin:0}.tab-summary p{margin:2px 0 0;color:var(--muted)}@keyframes panel-in{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
.cap{display:flex;align-items:center;gap:10px;color:#77736d;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}.cap .id{color:#aaa59c;font-weight:500}
.board{display:grid;grid-template-columns:repeat(var(--cols),minmax(250px,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);overflow:auto}
.column{background:var(--soft);border-radius:13px;padding:12px;min-height:220px}.column-head{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}.count{background:#dedbd5;border-radius:999px;padding:0 8px;color:#706d68;font-size:12px}
.card{background:#fff;border:1px solid #e3dfd8;border-radius:12px;padding:12px;margin:9px 0;box-shadow:0 2px 7px #3e35250a}.editable .card{cursor:pointer}.editable .card:hover{border-color:#aaa49a;transform:translateY(-1px)}.card-title{font-weight:700;line-height:1.4}.check{display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid #cfcbc4;border-radius:6px;margin-right:8px;vertical-align:-4px;color:#fff;font-size:12px}.done .check{background:var(--green);border-color:var(--green)}.doing .check{background:var(--blue);border-color:var(--blue)}
.desc{color:#74706a;font-size:13px;margin:7px 0}.tag{display:inline-block;background:#fff0ea;color:var(--accent);border-radius:7px;padding:2px 7px;margin:5px 5px 0 0;font-size:12px;font-weight:700}.assignee{color:#5c78b8}.meta{font-size:11px;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin-top:6px;display:inline-block}
.status{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}.state{display:inline-block;padding:4px 10px;border-radius:999px;background:#e8eefc;color:#4169bd;font-weight:700;font-size:12px}.state.done{background:#e5f4e9;color:#398250}.state.blocked,.state.awaiting-human{background:#fff0ea;color:#c44f27}.log{border-left:2px solid var(--line);margin:18px 0;padding-left:18px}.log div{margin:8px 0}.time{color:#9b978f;font-size:12px;margin-right:8px}
.chat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 20px;box-shadow:var(--shadow)}.msg{display:grid;grid-template-columns:145px 150px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid #efede9}.msg:last-child{border:0}.who{font-weight:700}.kind{font-size:10px;color:#888}.empty{padding:40px;text-align:center;color:var(--muted)}
.prose{max-width:880px}.prose a{color:#496ebd}.filters{display:flex;gap:8px;margin:0 0 12px}.filters input{width:340px;max-width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.loop{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.loop-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.loop-title{font-size:20px;font-weight:800;letter-spacing:-.02em}.loop-sub{color:var(--muted);font-size:12px;margin-top:5px}.loop-state{padding:5px 10px;border-radius:999px;background:#e8eefc;color:#4169bd;font-size:12px;font-weight:800}.loop-state.completed{background:#e5f4e9;color:#398250}.loop-state.failed,.loop-state.blocked,.loop-state.human_required,.loop-state.capability_unavailable{background:#fff0ea;color:#c44f27}.loop-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:18px 0}.metric{background:var(--soft);border-radius:11px;padding:10px}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:var(--muted);text-transform:uppercase}.loop-outcome{border-left:3px solid var(--accent);padding:8px 12px;margin:12px 0;color:#514d47}.loop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.loop-panel{border:1px solid var(--line);border-radius:12px;padding:13px;min-width:0}.loop-panel h3{font-size:13px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.06em;color:#77736d}.loop-row{padding:8px 0;border-top:1px solid #efede9}.loop-row:first-of-type{border-top:0}.loop-row-head{display:flex;gap:8px;align-items:flex-start}.loop-name{font-weight:750;word-break:break-word}.loop-detail{color:#77736d;font-size:12px;margin-top:3px;word-break:break-word}.badge{flex:none;border-radius:999px;padding:2px 7px;background:#ece9e4;color:#6f6a63;font-size:10px;font-weight:800;text-transform:uppercase}.badge.pass,.badge.ready,.badge.clear,.badge.supported,.badge.completed{background:#e5f4e9;color:#398250}.badge.fail,.badge.open,.badge.blocked,.badge.critical,.badge.high,.badge.failed{background:#fee9e3;color:#b94727}.badge.pending,.badge.not_run,.badge.missing,.badge.unknown,.badge.stale,.badge.directional,.badge.partial{background:#fff3d9;color:#946c16}.badge.human_required,.badge.unsupported,.badge.capability_unavailable{background:#eee8fb;color:#7156a7}.loop-paths{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.loop-paths code{font-size:11px;background:#f3f1ed;border-radius:6px;padding:3px 7px;color:#615d56}.progress-track{height:7px;background:#e9e6e0;border-radius:999px;overflow:hidden;margin-top:7px}.progress-fill{height:100%;background:var(--blue)}
.validation{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.validation-head{display:flex;justify-content:space-between;gap:16px;align-items:start}.validation-title{font-size:21px;font-weight:800}.validation-sub{color:var(--muted);font-size:12px}.validation-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.validation-meta .field{margin:0}.instructions{background:#fff7ed;border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px;margin:14px 0}.validation-task{border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0}.validation-task.active{border-color:var(--blue);box-shadow:0 0 0 2px #5e87d722}.validation-task h3{margin:0}.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--blue);margin-left:8px}.dimension{display:grid;grid-template-columns:80px 1fr auto 72px;gap:8px;align-items:center;margin:8px 0}.dimension input{min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px}.dimension-time{font-variant-numeric:tabular-nums;color:var(--muted)}.validation-extra{display:grid;grid-template-columns:120px 150px 1fr;gap:10px;align-items:end;margin-top:10px}.validation-extra textarea{min-height:44px;padding:8px;border:1px solid var(--line);border-radius:8px;resize:vertical}.validation-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.session-list{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.session-chip{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--soft);margin:3px;font-size:12px}.session-chip.pass{background:#e5f4e9;color:#398250}.session-chip.fail{background:#fee9e3;color:#b94727}
.feedback-step{padding:26px 4px 8px}.feedback-progress{height:6px;background:var(--soft);border-radius:99px;overflow:hidden;margin:18px 0 28px}.feedback-progress span{display:block;height:100%;background:var(--blue);transition:width .2s}.feedback-question{font-size:24px;line-height:1.35;margin:0 0 8px}.feedback-prompt{color:var(--muted);margin-bottom:24px}.feedback-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feedback-choice{min-height:66px;font-size:16px;font-weight:800}.feedback-choice.approve.selected{background:#e5f4e9;border-color:#7eb88b;color:#2d7540}.feedback-choice.revise.selected{background:#fff0ea;border-color:#e28b72;color:#aa3f26}.feedback-note{width:100%;min-height:72px;margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;resize:vertical}.feedback-nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.feedback-done{text-align:center;padding:38px 10px}.feedback-done b{display:block;font-size:24px;margin-bottom:8px}
.feedback-target{display:block;width:100%;max-height:430px;object-fit:contain;background:#101722;border-radius:14px;margin:0 0 22px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:#17151366;display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.dialog{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0003}.dialog h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:5px;margin:12px 0}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:90px;resize:vertical}.actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.right{display:flex;gap:8px}.danger{color:#b43f2b}.toast{position:fixed;right:20px;bottom:20px;background:#24221f;color:#fff;padding:10px 14px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}
@media(max-width:760px){.shell{padding:20px 12px 80px}.top{align-items:flex-start;flex-direction:column}.tools{width:100%;justify-content:space-between}h1{font-size:24px}.workspace{margin-top:16px}.tabs{top:6px}.tab{padding:9px 12px}.tab-summary h2{font-size:21px}.board{grid-template-columns:repeat(var(--cols),280px)}.msg{grid-template-columns:1fr}.msg .time{order:3}.loop-grid{grid-template-columns:1fr}.loop-metrics{grid-template-columns:1fr 1fr}.validation-meta{grid-template-columns:1fr}.dimension{grid-template-columns:70px 1fr}.dimension button,.dimension-time{grid-column:auto}.validation-extra{grid-template-columns:1fr}}
</style>
</head>
<body><main class="shell"><div class="top"><div id="heading"></div><div class="tools"><span id="connection" class="connection">只读模式</span><label class="file">载入 Markdown<input id="file" type="file" accept=".md,text/markdown,text/plain"></label></div></div><div id="app"></div></main>
<div id="editor" class="modal" role="dialog" aria-modal="true"><form id="task-form" class="dialog"><h2 id="editor-title">编辑任务</h2><div class="grid"><div class="field full"><label for="task-title">标题</label><input id="task-title" required maxlength="160"></div><div class="field"><label for="task-state">状态</label><select id="task-state"><option value="todo">待办</option><option value="doing">进行中</option><option value="done">已完成</option></select></div><div class="field"><label for="task-priority">优先级</label><select id="task-priority"><option value="">未设置</option><option value="p0">P0</option><option value="p1">P1</option><option value="p2">P2</option><option value="p3">P3</option></select></div><div class="field"><label for="task-owner">负责人</label><input id="task-owner" placeholder="例如 codex"></div><div class="field"><label for="task-due">截止日期</label><input id="task-due" type="date"></div><div class="field full"><label for="task-tags">标签（逗号分隔）</label><input id="task-tags" placeholder="ui, release"></div><div class="field full"><label for="task-desc">描述</label><textarea id="task-desc"></textarea></div></div><div class="actions"><button id="delete-task" type="button" class="danger">删除</button><div class="right"><button id="cancel-edit" type="button">取消</button><button class="primary" type="submit">保存任务</button></div></div></form></div><div id="toast" class="toast"></div>
<script>
const SOURCE_MD = "../../../../docs/workbench/hq.md";
const EMBEDDED_MD = null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noreferrer">$1</a>');
function parse(md){md=md.replace(/^---\s*\n[\s\S]*?\n---\s*(?:\n|$)/,"");let title=(md.match(/^#\s+(.+)$/m)||[])[1]||"项目 HQ";let parts=[],re=/```(board|status|chat|loop|validation)(?:\s+#([\w.-]+))?\s*\n([\s\S]*?)\n```/g,last=0,m;while(m=re.exec(md)){parts.push({kind:"prose",text:md.slice(last,m.index)});parts.push({kind:m[1],id:m[2]||"",text:m[3]});last=re.lastIndex}parts.push({kind:"prose",text:md.slice(last)});return{title,parts}}
function cap(kind,id){return `<div class="cap"><span>▣</span><span>${kind}</span><span class="id">${id?"#"+esc(id):""}</span></div>`}
function renderProse(t){let lines=t.split("\n").filter(x=>!/^#\s/.test(x)),out=[],list=false;for(const l of lines){if(/^##\s+/.test(l)){if(list){out.push("</ul>");list=false}out.push(`<h2>${inline(l.replace(/^##\s+/,""))}</h2>`)}else if(/^-\s+/.test(l)){if(!list){out.push("<ul>");list=true}out.push(`<li>${inline(l.replace(/^-\s+/,""))}</li>`)}else if(l.trim()){if(list){out.push("</ul>");list=false}out.push(`<p>${inline(l)}</p>`)} }if(list)out.push("</ul>");return out.length?`<div class="prose">${out.join("")}</div>`:""}
function parseBoard(text){let cols=[],cur=null,card=null,uid=0;for(const line of text.split("\n")){let h=line.match(/^##\s+(.+)/);if(h){cur={name:h[1],cards:[]};cols.push(cur);card=null;continue}let c=line.match(/^- \[([ x>])\]\s+(.+)/);if(c&&cur){let raw=c[2],tags=[...raw.matchAll(/#([\w-]+)/g)].map(x=>x[1]),owner=(raw.match(/@([\w-]+)/)||[])[1]||"",due=(raw.match(/!(\d{4}-\d{2}-\d{2})/)||[])[1]||"",title=raw.replace(/\s+#[\w-]+/g,"").replace(/\s+@[\w-]+/g,"").replace(/\s+!\d{4}-\d{2}-\d{2}/g,"");card={uid:uid++,state:c[1]==="x"?"done":c[1]===">"?"doing":"todo",title,tags,owner,due,priority:"",desc:[],meta:[]};cur.cards.push(card);continue}if(card&&/^\s{2,}\S/.test(line)){let value=line.trim(),pair=value.match(/^priority:\s*(.+)$/i);if(pair)card.priority=pair[1];else if(/^[\w -]+:\s/.test(value))card.meta.push(value);else card.desc.push(value)}}return cols}
function boardView(p){boardModel=parseBoard(p.text);let id="f"+Math.random().toString(36).slice(2);let html=`${cap("board",p.id)}<div class="filters"><input id="${id}" placeholder="筛选卡片（标题、@成员、#标签）">${editingEnabled?'<button class="primary" type="button" onclick="openTask()">＋ 新建任务</button>':""}</div><div class="board ${editingEnabled?"editable":""}" style="--cols:${boardModel.length}">`;for(const col of boardModel){html+=`<section class="column"><div class="column-head"><span>${esc(col.name)}</span><span class="count">${col.cards.length}</span></div>`;for(const c of col.cards){let search=[c.title,...c.tags,c.owner,...c.desc].join(" ").toLowerCase();html+=`<article class="card ${c.state}" data-search="${esc(search)}" ${editingEnabled?`onclick="openTask(${c.uid})"`:""}><div class="card-title"><span class="check">${c.state==="done"?"✓":c.state==="doing"?"›":""}</span>${inline(c.title)}</div>${c.desc.map(x=>`<div class="desc">${inline(x)}</div>`).join("")}<div>${c.priority?`<span class="meta">${esc(c.priority.toUpperCase())}</span>`:""}${c.due?`<span class="meta">截止 ${esc(c.due)}</span>`:""}</div><div>${c.owner?`<span class="assignee">@${esc(c.owner)} </span>`:""}${c.tags.map(x=>`<span class="tag">#${esc(x)}</span>`).join("")}</div></article>`}html+="</section>"}html+="</div>";setTimeout(()=>{let input=document.getElementById(id);input?.addEventListener("input",()=>document.querySelectorAll(`#${id} + .board .card`).forEach(c=>c.hidden=!c.dataset.search.includes(input.value.toLowerCase())))},0);return `<section class="component">${html}</section>`}
function statusView(p){let state=(p.text.match(/^state:\s*(\S+)/m)||[])[1]||"building",logs=[...p.text.matchAll(/^-\s+(\S+)\s+(.+)$/gm)],checks=[...p.text.matchAll(/^- \[([ x])\]\s+(.+)$/gm)];return `<section class="component">${cap("status",p.id)}<div class="status"><span class="state ${esc(state)}">${esc(state)}</span><div class="log">${logs.map(x=>`<div><span class="time">${esc(x[1])}</span>${inline(x[2])}</div>`).join("")}</div>${checks.length?`<h3>Checklist</h3>${checks.map(x=>`<div>${x[1]==="x"?"✅":"⬜"} ${inline(x[2])}</div>`).join("")}`:""}</div></section>`}
function chatView(p){let msgs=[...p.text.matchAll(/^-\s+(\S+)\s+@([^: (]+)(?:\s+\(([^)]+)\))?:\s*(.*)$/gm)];return `<section class="component">${cap("chat",p.id)}<div class="chat">${msgs.length?msgs.map(x=>`<div class="msg"><span class="time">${esc(x[1])}</span><span class="who">@${esc(x[2])} <small class="kind">${esc(x[3]||"")}</small></span><span>${inline(x[4])}</span></div>`).join(""):'<div class="empty">暂无消息</div>'}</div></section>`}
function parseLoop(text){let sections={},current="",meta={};for(const line of text.split("\n")){let heading=line.match(/^##\s+(.+)/);if(heading){current=heading[1];sections[current]=[];continue}if(current){if(line.trim())sections[current].push(line);continue}let pair=line.match(/^([a-z_]+):\s*(.*)$/);if(pair)meta[pair[1]]=pair[2]}return{meta,sections}}
function loopRows(lines){return(lines||[]).map(line=>{let match=line.match(/^- \[([^\]]+)\]\s+([^:]+?)(?:\s+::\s+(.*))?$/),plain=line.match(/^-\s+(.+?)(?:\s+::\s+(.*))?$/);if(match)return{status:match[1],name:match[2].trim(),detail:match[3]||""};if(plain)return{status:"",name:plain[1].trim(),detail:plain[2]||""};return{status:"",name:line,detail:""}})}
function loopPanel(title,lines){let rows=loopRows(lines);return `<div class="loop-panel"><h3>${esc(title)}</h3>${rows.length?rows.map(r=>`<div class="loop-row"><div class="loop-row-head">${r.status?`<span class="badge ${esc(r.status)}">${esc(r.status)}</span>`:""}<span class="loop-name">${inline(r.name)}</span></div>${r.detail?`<div class="loop-detail">${inline(r.detail)}</div>`:""}</div>`).join(""):'<div class="empty">暂无记录</div>'}</div>`}
function loopView(p){let {meta,sections}=parseLoop(p.text),iteration=(meta.iteration||"0/?").split("/"),current=Number(iteration[0])||0,total=Number(iteration[1])||0,pct=total?Math.min(100,Math.round(current/total*100)):0,gateRows=loopRows(sections["Quality Gates"]),evidenceRows=loopRows(sections["Evidence"]),findingRows=loopRows(sections["Open Findings"]),pass=gateRows.filter(x=>x.status==="pass").length,currentEvidence=evidenceRows.filter(x=>!["stale","missing"].includes(x.status)).length,openFindings=findingRows.filter(x=>!["clear","resolved"].includes(x.status)).length,outcome=loopRows(sections["Player Outcome"]),paths=[meta.knowledge_node,meta.run_dir,meta.run_spec,meta.progress].filter(Boolean);return `<section class="component">${cap("loop",p.id)}<div class="loop"><div class="loop-head"><div><div class="loop-title">${inline(meta.title||p.id)}</div><div class="loop-sub">run ${esc(p.id)} · revision ${esc(meta.revision||"unknown")} · 更新 ${esc(meta.updated_at||"")}</div></div><span class="loop-state ${esc(meta.state||"unknown")}">${esc(meta.state||"unknown")}</span></div><div class="loop-metrics"><div class="metric"><b>${esc(meta.iteration||"0/?")}</b><span>Iteration</span><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div><div class="metric"><b>${pass}/${gateRows.length}</b><span>Gates passed</span></div><div class="metric"><b>${currentEvidence}</b><span>Evidence records</span></div><div class="metric"><b>${openFindings}</b><span>Open findings</span></div></div>${outcome.length?`<div class="loop-outcome">${outcome.map(x=>`<div><b>${esc(x.name)}</b>${x.detail?`: ${inline(x.detail)}`:""}</div>`).join("")}</div>`:""}<div class="loop-grid">${loopPanel("Test Scenarios",sections["Test Scenarios"])}${loopPanel("Quality Gates",sections["Quality Gates"])}${loopPanel("Open Findings",sections["Open Findings"])}${loopPanel("Evidence",sections["Evidence"])}${loopPanel("Host Capabilities",sections["Host Capabilities"])}${loopPanel("Decisions",sections["Decisions"])}</div>${paths.length?`<div class="loop-paths">${paths.map(x=>`<code>${esc(x)}</code>`).join("")}</div>`:""}</div></section>`}
const dimensionLabels={goal:"目标",risk:"风险",action:"下一步"};
let validationSpecs={},validationRuns={},validationSessions={};
function validationView(p){let spec;try{spec=JSON.parse(p.text)}catch(error){return `<section class="component">${cap("validation",p.id)}<div class="validation"><b>验证配置无效</b></div></section>`}validationSpecs[spec.validation_id]=spec;let id=spec.validation_id,sessions=validationSessions[id]||[],approved=sessions.filter(x=>x.passed_two_second).length;validationRuns[id]=validationRuns[id]||{index:0,feedback:{}};setTimeout(()=>loadValidationSessions(id),0);return `<section class="component">${cap("validation",p.id)}<div class="validation" id="validation-${esc(id)}"><div class="validation-head"><div><div class="validation-title">${inline(spec.title)}</div><div class="validation-sub">看一项，答一个问题；补充说明可不填</div></div><span class="badge human_required" id="validation-progress-${esc(id)}">${approved}/${sessions.length||spec.participant_target} 满意</span></div><div id="feedback-host-${esc(id)}"></div><div class="session-list" id="validation-sessions-${esc(id)}">${sessionHtml(sessions)}</div><p class="validation-sub">反馈只做原始记录，不会自动通过正式质量门。</p></div></section>`}
function validationState(id){return validationRuns[id]||(validationRuns[id]={index:0,feedback:{}})}
function feedbackImage(path){if(!path)return"";let clean=String(path).replace(/^\/+/,"");return apiToken?`/repo/${clean}?token=${encodeURIComponent(apiToken)}`:`../../${clean}`}
function renderFeedbackStep(id){let spec=validationSpecs[id],state=validationState(id),host=document.getElementById(`feedback-host-${id}`);if(!host)return;let task=spec.tasks[state.index],saved=state.feedback[task.task_id]||{},target=feedbackImage(task.image),last=state.index===spec.tasks.length-1;host.innerHTML=`<div class="feedback-progress"><span style="width:${(state.index+1)/spec.tasks.length*100}%"></span></div><div class="feedback-step">${target?`<img class="feedback-target" src="${esc(target)}" alt="${esc(task.title)} 验收画面">`:""}<div class="validation-sub">${state.index+1} / ${spec.tasks.length} · ${inline(task.title)}</div><h3 class="feedback-question">${inline(task.prompt)}</h3><p class="feedback-prompt">这部分是否符合你的预期？</p><div class="feedback-choices"><button class="feedback-choice approve ${saved.verdict==="approve"?"selected":""}" onclick="chooseFeedback('${id}','approve')">👍 满意</button><button class="feedback-choice revise ${saved.verdict==="revise"?"selected":""}" onclick="chooseFeedback('${id}','revise')">✎ 要修改</button></div><textarea class="feedback-note" id="feedback-note-${id}" placeholder="可选：直接说哪里不对、你想要什么">${esc(saved.note||"")}</textarea><div class="feedback-nav"><button ${state.index===0?"disabled":""} onclick="feedbackBack('${id}')">← 上一个</button><button class="primary" onclick="feedbackNext('${id}')">${last?"提交反馈":"下一个 →"}</button></div></div>`}
function chooseFeedback(id,verdict){let state=validationState(id),task=validationSpecs[id].tasks[state.index],note=document.getElementById(`feedback-note-${id}`)?.value.trim()||"";state.feedback[task.task_id]={verdict,note};renderFeedbackStep(id)}
async function feedbackNext(id){let state=validationState(id),spec=validationSpecs[id],task=spec.tasks[state.index],saved=state.feedback[task.task_id]||{},note=document.getElementById(`feedback-note-${id}`)?.value.trim()||"";if(!saved.verdict){alert("请先选择“满意”或“要修改”");return}saved.note=note;state.feedback[task.task_id]=saved;if(state.index===spec.tasks.length-1){await submitValidation(id);return}state.index++;renderFeedbackStep(id)}
function feedbackBack(id){let state=validationState(id);if(state.index>0){state.index--;renderFeedbackStep(id)}}
function validationPayload(id){let spec=validationSpecs[id],state=validationState(id);return{validation_id:id,participant_id:`feedback-${Date.now().toString(36)}`,device:navigator.platform||"browser",browser:navigator.userAgent.slice(0,160),feedback_results:spec.tasks.map(task=>({task_id:task.task_id,verdict:state.feedback[task.task_id]?.verdict||"",note:state.feedback[task.task_id]?.note||""}))}}
function validatePayload(payload){for(let result of payload.feedback_results)if(!["approve","revise"].includes(result.verdict))throw new Error("还有问题没有评价")}
function downloadJson(payload){let blob=new Blob([JSON.stringify(payload,null,2)+"\n"],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`${payload.validation_id}-${payload.participant_id||"draft"}.json`;a.click();URL.revokeObjectURL(url)}
function exportValidation(id){try{let payload=validationPayload(id);validatePayload(payload);downloadJson(payload)}catch(error){alert(error.message)}}
async function submitValidation(id){try{let payload=validationPayload(id);validatePayload(payload);if(!apiToken){downloadJson(payload);toast("静态页面已导出 JSON；启动 serve 可直接保存");return}let response=await fetch(`/api/validation-session?token=${encodeURIComponent(apiToken)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw new Error(data.error||"保存失败");validationSessions[id]=data.sessions||[];updateValidationSessions(id);resetValidation(id);toast(`记录已保存：${data.path}`)}catch(error){alert(error.message)}}
function resetValidation(id){validationRuns[id]={index:0,feedback:{}};renderFeedbackStep(id)}
function sessionHtml(sessions){return sessions.length?`<b>最近反馈</b><div>${sessions.slice(-8).map(x=>`<span class="session-chip ${x.passed_two_second?"pass":"fail"}">${x.passed_two_second?"满意":"要修改"}</span>`).join("")}</div>`:'<div class="empty">还没有反馈</div>'}
function updateValidationSessions(id){let sessions=validationSessions[id]||[],passed=sessions.filter(x=>x.passed_two_second).length,list=document.getElementById(`validation-sessions-${id}`),progress=document.getElementById(`validation-progress-${id}`);if(list)list.innerHTML=sessionHtml(sessions);if(progress){progress.textContent=`${passed}/${sessions.length} 满意`;progress.className=`badge ${sessions.length&&passed===sessions.length?"pass":"human_required"}`}}
async function loadValidationSessions(id){renderFeedbackStep(id);if(!apiToken)return;try{let response=await fetch(`/api/validation-sessions?validation_id=${encodeURIComponent(id)}&token=${encodeURIComponent(apiToken)}`,{cache:"no-store"}),data=await response.json();if(response.ok){validationSessions[id]=data.sessions||[];updateValidationSessions(id)}}catch(_error){}}
let currentMd="",boardModel=[],activeUid=null,editingEnabled=false,apiToken=new URLSearchParams(location.search).get("token")||"";
const tabConfig=[{id:"validation",icon:"◎",label:"验证",kinds:["validation"],hint:"直接主持、计时并保存真人观察"},{id:"board",icon:"▦",label:"看板",kinds:["board"],hint:"任务、负责人和当前进度"},{id:"loops",icon:"◉",label:"Loop",kinds:["loop"],hint:"质量门、证据和未关闭问题"},{id:"activity",icon:"◌",label:"动态",kinds:["status","chat"],hint:"项目状态、日志和协作消息"},{id:"overview",icon:"⌂",label:"概览",kinds:["prose"],hint:"项目说明和事实入口"}];
function partView(p){return p.kind==="board"?boardView(p):p.kind==="status"?statusView(p):p.kind==="chat"?chatView(p):p.kind==="loop"?loopView(p):p.kind==="validation"?validationView(p):renderProse(p.text)}
function desiredTab(available){let hash=location.hash.replace(/^#tab-/,""),stored=localStorage.getItem("caesar-workbench-tab");return[hash,stored,"validation","board","overview"].find(id=>available.includes(id))||available[0]}
function switchTab(id,focus=false){let button=document.querySelector(`.tab[data-tab="${id}"]`);if(!button)return;document.querySelectorAll(".tab").forEach(x=>{let active=x===button;x.classList.toggle("active",active);x.setAttribute("aria-selected",String(active));x.tabIndex=active?0:-1});document.querySelectorAll(".tab-panel").forEach(x=>x.classList.toggle("active",x.dataset.panel===id));localStorage.setItem("caesar-workbench-tab",id);history.replaceState(null,"",`#tab-${id}`);if(focus)button.focus()}
function bindTabs(){let tabs=[...document.querySelectorAll(".tab")];tabs.forEach((tab,index)=>{tab.addEventListener("click",()=>switchTab(tab.dataset.tab));tab.addEventListener("keydown",event=>{if(!["ArrowLeft","ArrowRight","Home","End"].includes(event.key))return;event.preventDefault();let next=event.key==="Home"?0:event.key==="End"?tabs.length-1:(index+(event.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;switchTab(tabs[next].dataset.tab,true)})})}
function render(md){currentMd=md;validationSpecs={};let data=parse(md),groups=tabConfig.map(tab=>({...tab,parts:data.parts.filter(p=>tab.kinds.includes(p.kind)&&partView(p))})).filter(tab=>tab.parts.length),available=groups.map(x=>x.id),active=desiredTab(available);document.title=data.title;document.getElementById("heading").innerHTML=`<h1>${esc(data.title)}</h1>`;document.getElementById("app").innerHTML=`<div class="workspace"><nav class="tabs" role="tablist" aria-label="Workbench 分区">${groups.map(tab=>`<button class="tab ${tab.id===active?"active":""}" type="button" role="tab" aria-selected="${tab.id===active}" tabindex="${tab.id===active?0:-1}" data-tab="${tab.id}"><span class="tab-icon">${tab.icon}</span><span>${tab.label}</span><span class="tab-count">${tab.parts.length}</span></button>`).join("")}</nav>${groups.map(tab=>`<section class="tab-panel ${tab.id===active?"active":""}" role="tabpanel" data-panel="${tab.id}"><div class="tab-summary"><div><h2>${tab.icon} ${tab.label}</h2><p>${tab.hint}</p></div></div>${tab.parts.map(partView).join("")}</section>`).join("")}</div>`;bindTabs()}
function allCards(){return boardModel.flatMap(c=>c.cards)}
function openTask(uid=null){if(!editingEnabled)return;activeUid=uid;let c=uid===null?{title:"",state:"todo",priority:"",owner:"",due:"",tags:[],desc:[]} : allCards().find(x=>x.uid===uid);if(!c)return;document.getElementById("editor-title").textContent=uid===null?"新建任务":"编辑任务";document.getElementById("task-title").value=c.title;document.getElementById("task-state").value=c.state;document.getElementById("task-priority").value=c.priority;document.getElementById("task-owner").value=c.owner;document.getElementById("task-due").value=c.due;document.getElementById("task-tags").value=c.tags.join(", ");document.getElementById("task-desc").value=c.desc.join("\n");document.getElementById("delete-task").hidden=uid===null;document.getElementById("editor").classList.add("open");document.getElementById("task-title").focus()}
function closeTask(){document.getElementById("editor").classList.remove("open")}
function formCard(){return{uid:activeUid,title:document.getElementById("task-title").value.trim(),state:document.getElementById("task-state").value,priority:document.getElementById("task-priority").value,owner:document.getElementById("task-owner").value.trim().replace(/^@/,""),due:document.getElementById("task-due").value,tags:document.getElementById("task-tags").value.split(",").map(x=>x.trim().replace(/^#/,"")).filter(Boolean),desc:document.getElementById("task-desc").value.split("\n").map(x=>x.trim()).filter(Boolean),meta:[]}}
function serializeBoard(cards){let groups=[["待办","todo"," "],["进行中","doing",">"],["已完成","done","x"]],lines=[];for(let[name,state,mark]of groups){lines.push("## "+name);for(let c of cards.filter(x=>x.state===state)){let row=`- [${mark}] ${c.title}`;if(c.owner)row+=` @${c.owner}`;for(let tag of c.tags)row+=` #${tag}`;if(c.due)row+=` !${c.due}`;lines.push(row);if(c.priority)lines.push(`  priority: ${c.priority}`);for(let d of c.desc)lines.push(`  ${d}`);for(let m of(c.meta||[]))lines.push(`  ${m}`)}}return lines.join("\n")}
function replaceBoard(md,body){return md.replace(/```board(?:\s+#project)?\s*\n[\s\S]*?\n```/,` \`\`\`board #project\n${body}\n\`\`\``).replace(/^ ```board/m,"```board")}
async function persist(cards){let content=replaceBoard(currentMd,serializeBoard(cards)),response=await fetch(`/api/hq?token=${encodeURIComponent(apiToken)}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})}),data=await response.json();if(!response.ok)throw new Error(data.error||"保存失败");render(data.content);toast("已写入 docs/workbench/hq.md")}
function toast(message){let el=document.getElementById("toast");el.textContent=message;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800)}
document.getElementById("task-form").addEventListener("submit",async e=>{e.preventDefault();let card=formCard(),cards=allCards().filter(x=>x.uid!==activeUid);cards.push(card);try{await persist(cards);closeTask()}catch(error){alert(error.message)}})
document.getElementById("delete-task").addEventListener("click",async()=>{if(!confirm("确定删除这个任务？"))return;try{await persist(allCards().filter(x=>x.uid!==activeUid));closeTask()}catch(error){alert(error.message)}})
document.getElementById("cancel-edit").addEventListener("click",closeTask);document.getElementById("editor").addEventListener("click",e=>{if(e.target.id==="editor")closeTask()})
document.getElementById("file").addEventListener("change",async e=>{let f=e.target.files[0];if(f)render(await f.text())});
async function boot(){let md=EMBEDDED_MD;if(apiToken){try{let response=await fetch(`/api/hq?token=${encodeURIComponent(apiToken)}`,{cache:"no-store"});if(response.ok){md=(await response.json()).content;editingEnabled=true;let c=document.getElementById("connection");c.textContent="本地编辑已连接";c.classList.add("live")}}catch(_error){}}else{try{let response=await fetch(SOURCE_MD,{cache:"no-store"});if(response.ok)md=await response.text()}catch(_error){}}render(md||"# 项目 HQ\n\n尚未找到固定位置的 Markdown。")}
boot();
</script></body></html>
