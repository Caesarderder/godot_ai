[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="release/*"
exclude_filter="artifacts/*,build/*,tools/*,tests/*,scripts/main.gd"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
html/canvas_resize_policy=2
html/experimental_virtual_keyboard=false
html/export_icon=true
html/focus_canvas_on_start=true
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><meta name=\"theme-color\" content=\"#11131a\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">"
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page="release/offline.html"
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.0666667, 0.0745098, 0.101961, 1)
progressive_web_app/icon_144x144="release/web-icon.svg"
progressive_web_app/icon_180x180="release/web-icon.svg"
progressive_web_app/icon_512x512="release/web-icon.svg"
